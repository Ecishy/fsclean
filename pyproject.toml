[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fsclean"
version = "0.1.0"
description = "Tidy messy folders (Downloads!) by moving loose files into category folders; dry-run by default, pure standard library."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Ecishy" }]
keywords = ["organize", "cleanup", "downloads", "files", "tidy", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Filesystems",
    "Topic :: Utilities",
]

[project.scripts]
fsclean = "fsclean.cli:run"

[tool.hatch.build.targets.wheel]
packages = ["src/fsclean"]
